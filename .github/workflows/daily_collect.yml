name: 매일 리뷰 자동 수집

on:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC = 13:00 KST
  workflow_dispatch: {}

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 의존 패키지 설치
        run: pip install -r requirements.txt

      - name: Playwright 브라우저 설치 (카카오/구글 수집용)
        run: playwright install --with-deps chromium

      - name: 리뷰 수집 실행
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_SHEET_ID: "1-F-znYuGESKC-l1CjdxRMm6JhBRk6_Sd1LgIgzN7h2E"
        run: python main.py
